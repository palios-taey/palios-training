# r5-audit-gate — MECHANICAL enforcement of the R5 adversarial-audit gate.
#
# Why this exists: the audit gate used to be a process convention ("don't merge
# until both auditors ENDORSE"). A convention is not a gate — a merge raced it
# (orchestrator #55, 2026-06-11). This makes it structural: a PR that touches a
# risky surface (.github/r5-risky-paths) CANNOT merge until BOTH adversarial
# auditors post a `success` commit status (audit/grok + audit/gatekeeper) on the
# PR head SHA.
#
# How branch protection must be wired (post-PR28 process defect hardening):
#   - Require the GitHub Actions check named `gate` (this job). That check is
#     app-bound to GitHub Actions — not a forgeable commit-status context.
#   - Do NOT require a commit status named `r5-audit-gate`. This workflow does
#     not write any commit statuses.
#   - PAT / human auditors may write ONLY `audit/<name>` statuses (e.g.
#     audit/grok, audit/gatekeeper). They must not write the Actions check.
#
# Known limitation (Gatekeeper PR#57, non-blocking): this verifies the auditor
# status CONTEXT + STATE, not WHO posted it — anyone with statuses:write could
# forge an auditor success. That is inherent to commit-status auditor verdicts
# and bounded by repo write access. A future hardening could verify the status
# creator / require signed verdicts. Separately, the merge gate itself is now
# the Actions job outcome (exit nonzero on missing/failed audits), which is
# not writable via the commit-status API.
#
# Auditors post their verdict (on ENDORSE / BLOCK) with:
#   gh api repos/$REPO/statuses/$SHA -f state=success -f context=audit/grok \
#     -f description="ENDORSE" -f target_url=<verdict-log-url>
# (state=failure on BLOCK). The gate re-evaluates on pull_request and on
# audit/grok|audit/gatekeeper status events.
name: r5-audit-gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
  status: {}

permissions:
  contents: read
  pull-requests: read
  # No statuses:write — this job must not mint r5-audit-gate (or any) commit
  # statuses. Branch protection consumes the Actions check `gate` instead.

jobs:
  gate:
    runs-on: ubuntu-latest
    # Only pull_request events, or status events from the two auditor contexts.
    # Do not react to other status contexts (avoids noise; there is no self-status
    # to exclude because this workflow writes none).
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'status' &&
       (github.event.context == 'audit/grok' ||
        github.event.context == 'audit/gatekeeper'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate R5 audit gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Resolve the head SHA + base ref for both pull_request and status events.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            PR_NUM="${{ github.event.pull_request.number }}"
          else
            HEAD_SHA="${{ github.event.sha }}"
            # find an open PR whose head is this SHA
            PR_JSON="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" 2>/dev/null || echo '[]')"
            PR_NUM="$(echo "$PR_JSON" | jq -r '.[0].number // empty')"
            BASE_REF="$(echo "$PR_JSON" | jq -r '.[0].base.ref // empty')"
            if [ -z "$PR_NUM" ]; then
              echo "status event for $HEAD_SHA maps to no open PR — nothing to gate."
              exit 0
            fi
          fi
          echo "PR #$PR_NUM head=$HEAD_SHA base=$BASE_REF"

          # Changed files vs base.
          git fetch -q origin "$BASE_REF"
          CHANGED="$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA")"
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # Does any changed file match a risky glob?
          RISKY=0
          while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            case "$pat" in \#*) continue;; esac
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in $pat) RISKY=1; echo "  RISKY: $f matches $pat";; esac
            done <<< "$CHANGED"
          done < .github/r5-risky-paths

          if [ "$RISKY" -eq 0 ]; then
            echo "no R5 risky surface touched — Actions check gate succeeds."
            exit 0
          fi

          # Risky: require BOTH auditor statuses = success on HEAD_SHA.
          # Use the combined-status endpoint (one JSON object). Do NOT use
          # `gh api --paginate` on /statuses and feed it to jq as a single
          # array — multi-page output is multiple arrays and silently breaks
          # latest-per-context selection on noisy heads (CONTROL finding).
          # Combined status includes the latest status object per context.
          COMBINED="$(gh api "repos/$REPO/commits/$HEAD_SHA/status")"
          grok_state="$(echo "$COMBINED" | jq -r '([.statuses[]? | select(.context=="audit/grok")][0].state) // "missing"')"
          gk_state="$(echo "$COMBINED" | jq -r '([.statuses[]? | select(.context=="audit/gatekeeper")][0].state) // "missing"')"
          echo "audit/grok=$grok_state audit/gatekeeper=$gk_state"
          echo "combined_state=$(echo "$COMBINED" | jq -r '.state // "missing"')"

          if [ "$grok_state" = "success" ] && [ "$gk_state" = "success" ]; then
            echo "R5 ENDORSED: grok + gatekeeper — Actions check gate succeeds."
            exit 0
          fi

          echo "R5 required: grok=$grok_state gatekeeper=$gk_state (both must be success)"
          echo "Failing the Actions job (nonzero exit). No commit status is written."
          exit 1
