# r5-audit-gate — MECHANICAL enforcement of the R5 adversarial-audit gate.
#
# Why this exists: the audit gate used to be a process convention ("don't merge
# until both auditors ENDORSE"). A convention is not a gate — a merge raced it
# (orchestrator #55, 2026-06-11). This makes it structural: a PR with a nonempty
# diff CANNOT merge until BOTH adversarial auditors post a `success` commit
# status (audit/grok + audit/gatekeeper) on the exact PR head SHA.
#
# How branch protection must be wired (post-PR28 / PR32 rework):
#   - Require the GitHub Actions check named `gate` (this job). That check is
#     app-bound to GitHub Actions — not a forgeable commit-status context.
#   - Do NOT require a commit status named `r5-audit-gate`. This workflow does
#     not write any commit statuses.
#   - PAT / human auditors may write ONLY `audit/<name>` statuses (e.g.
#     audit/grok, audit/gatekeeper). They must not write the Actions check.
#
# Risk model: every nonempty repository PR diff is R5-risky. There is no
# `.github/r5-risky-paths` allowlist — that file missed 34/269 tracked paths
# (including moe-35b production surfaces). Empty diff → gate succeeds.
#
# Triggers: pull_request only. Status events are intentionally NOT used —
# default-branch status-event runs do not refresh the PR-head app check named
# `gate`, and previously re-minted a forgeable `r5-audit-gate` commit status
# from main's old workflow.
#
# CONTROL (after both exact-head auditor statuses exist): the supervisor
# re-runs this original pull_request Actions run (gh run rerun <run_id> or
# empty synchronize) and verifies the app-bound `gate` check is success on
# the UNCHANGED head SHA before merge. Auditors posting status alone does
# not re-evaluate this job.
#
# Known residual (Gatekeeper PR#57, non-blocking): this verifies auditor
# status CONTEXT + STATE, not WHO posted it. A shared PAT / statuses:write
# actor does not mechanically prove distinct auditor seats. Bounded by repo
# write access. A future hardening could verify status creator / require
# signed verdicts. The merge gate itself is the Actions job outcome (exit
# nonzero on missing/failed audits), which is not writable via the
# commit-status API.
#
# Auditors post their verdict (on ENDORSE / BLOCK) with:
#   gh api repos/$REPO/statuses/$SHA -f state=success -f context=audit/grok \
#     -f description="ENDORSE" -f target_url=<verdict-log-url>
# (state=failure on BLOCK). Then CONTROL re-runs this pull_request gate.
name: r5-audit-gate

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  # No statuses:write — this job must not mint r5-audit-gate (or any) commit
  # statuses. Branch protection consumes the Actions check `gate` instead.

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate R5 audit gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "PR #$PR_NUM head=$HEAD_SHA base=$BASE_REF"

          git fetch -q origin "$BASE_REF"
          CHANGED="$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA" || true)"
          echo "changed files:"
          if [ -z "$CHANGED" ]; then
            echo "  (none)"
            echo "empty PR diff — Actions check gate succeeds."
            exit 0
          fi
          printf '%s\n' "$CHANGED" | sed 's/^/  /'
          echo "nonempty PR diff — R5 required for every path (no r5-risky-paths allowlist)."

          # All commit statuses, every page. Require gh api --paginate --slurp
          # (gh >= 2.48) so multi-page output is one JSON array-of-pages.
          # Do NOT feed bare --paginate multi-array streams into jq.
          if ! command -v gh >/dev/null; then
            echo "FAIL: gh CLI missing"
            exit 1
          fi
          if ! gh api --help 2>&1 | grep -q -- '--slurp'; then
            echo "FAIL: gh api lacks --slurp (need gh >= 2.48 for fail-closed pagination)"
            gh --version || true
            exit 1
          fi

          set +e
          PAGES="$(gh api --paginate --slurp "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" 2>/tmp/r5-statuses.err)"
          API_RC=$?
          set -e
          if [ "$API_RC" -ne 0 ]; then
            echo "FAIL: commit statuses API failed (rc=$API_RC)"
            cat /tmp/r5-statuses.err >&2 || true
            exit 1
          fi

          # Flatten pages; select latest per context by numeric id; fail closed
          # on malformed JSON or ambiguous id/created_at ordering.
          set +e
          EVAL="$(printf '%s' "$PAGES" | jq -e -c '
            if type != "array" then
              error("statuses pages root is not a JSON array")
            else . end
            | if length == 0 then
                []
              elif any(.[]; type != "array") then
                error("statuses page element is not a JSON array")
              else
                [.[]] | add // []
              end
            | if any(.[];
                (.id | type) != "number"
                or (.context | type) != "string"
                or (.state | type) != "string"
                or (.created_at | type) != "string"
              ) then
                error("malformed status object (id/context/state/created_at)")
              else . end
            | group_by(.context)
            | map(
                sort_by(.id)
                | reverse
                | if length > 1 and (.[0].created_at < .[1].created_at) then
                    error("ambiguous ordering for context \(.[0].context): higher id has older created_at")
                  else
                    {context: .[0].context, state: .[0].state, id: .[0].id}
                  end
              )
          ' 2>/tmp/r5-jq.err)"
          JQ_RC=$?
          set -e
          if [ "$JQ_RC" -ne 0 ]; then
            echo "FAIL: status parse/select failed (malformed JSON or ambiguous ordering)"
            cat /tmp/r5-jq.err >&2 || true
            echo "pages_head=$(printf '%s' "$PAGES" | head -c 200)"
            exit 1
          fi

          grok_state="$(printf '%s' "$EVAL" | jq -r '([.[] | select(.context=="audit/grok")][0].state) // "missing"')"
          gk_state="$(printf '%s' "$EVAL" | jq -r '([.[] | select(.context=="audit/gatekeeper")][0].state) // "missing"')"
          echo "audit/grok=$grok_state audit/gatekeeper=$gk_state"
          echo "contexts=$(printf '%s' "$EVAL" | jq -c '[.[] | {context,state,id}]')"

          if [ "$grok_state" = "success" ] && [ "$gk_state" = "success" ]; then
            echo "R5 ENDORSED: grok + gatekeeper — Actions check gate succeeds."
            exit 0
          fi

          echo "R5 required: grok=$grok_state gatekeeper=$gk_state (both must be success)"
          echo "Failing the Actions job (nonzero exit). No commit status is written."
          echo "CONTROL: after both exact-head auditor statuses are success, re-run this pull_request workflow and verify gate success on the unchanged SHA."
          exit 1
