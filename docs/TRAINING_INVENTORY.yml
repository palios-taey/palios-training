node_dependency_residue:
  # Development checkouts SHADOWING installed packages on training nodes. Found 2026-07-31
  # while lending Spark4 for a scorer A/B; both instances were on ONE node while its peers
  # carried none, so this is node-level accumulation rather than a fleet property.
  #
  # WHY IT MATTERS AND WHY A PATH LISTING WILL NOT FIND IT: an editable install writes a .pth
  # that executes at interpreter startup and installs a finder redirecting imports AHEAD of
  # site-packages. Inspecting site-packages contents shows the installed version; the import
  # returns the checkout. The only reliable probe is to RESOLVE THROUGH THE RUNNING
  # INTERPRETER - import it, print __file__, hash that.
  - node: 1
    vllm_mem_utils_copies: 0
    distinct_contents: 0
    editable_pth_overrides: 0
  - node: 2
    vllm_mem_utils_copies: 0
    distinct_contents: 0
    editable_pth_overrides: 0
  - node: 3
    vllm_mem_utils_copies: 0
    distinct_contents: 0
    editable_pth_overrides: 0
  - node: 4
    vllm_mem_utils_copies: 4
    distinct_contents: 2
    editable_pth_overrides: 2
