# ============================================================================
# AUTHORIZATION — a named human act, bound to exact bytes, consumed by a receipt.
#
# NOT a status and NOT a --force. cpt_27b_4node stays CANDIDATE_PENDING_PRODUCTION_RUN, which is
# the honest state: these bytes carry the W3/W5/W6 remediation and have never completed a
# production run. This object permits ONE campaign on EXACTLY the bytes named below. Change one
# byte of any of them and the authorization no longer describes what you are running, and the
# resolver refuses. That binding — not a use-counter — is what keeps this from becoming a standing
# path (shape designed by tutor-grok; both of tutor's earlier shapes were rejected, one of which
# would have refused session 2 of a multi-session campaign).
#
# AUTHORIZED BY JESSE, 2026-08-19, verbatim: "So do the training run again on the base using the
# full production infrastructure that you just cleaned up. This should include corpus generation,
# tokenization, packing/chunking, max GPU util, vars, everthing all the way through baking." and
# "Just do 1 epoch though and adjust variables accordingly."
#
# CONSUMPTION: campaign cpt_prod_v4_repos_1ep is spent the moment a receipt in this manifest
# records that campaign_id. A second campaign requires a second authorization commit. After the
# run, the promotion commit records the receipt AND DELETES THIS BLOCK — check_manifest_pins.py
# fails if an authorization survives promotion (A1/A7), so a forgotten cleanup is caught by CI
# rather than by whoever launches next.
# SUPERSEDES cpt_prod_v4_repos_1ep, same day. That campaign trained 85/85 but could not be baked:
# run_config.env had four consumers and zero producers, so post_cpt_pipeline.sh:42 aborted and the
# checkpoint is preserved and quarantined. a3dd59cc gives the trainer a writer for it, which changed
# the trainer bytes and correctly VOIDED the v4 authorization — the resolver refused with "the
# authorization does not describe this capability". This object re-authorizes the SAME campaign on
# the bytes that can actually finish it. v4 produced no receipt and will never be promoted.
