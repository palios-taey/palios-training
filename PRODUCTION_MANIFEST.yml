# PRODUCTION_MANIFEST.yml
#
# WHAT THIS IS. The single machine-readable answer to "what is production infrastructure".
# A file is production IF AND ONLY IF it has an execution receipt: it ran on the real cluster and
# produced a verified artifact. Not because of its name, its location, its recency, or because a
# document says so. Anything not listed here is NOT production.
#
# WHY IT EXISTS. Measured 2026-07-30: 27 launcher/trainer files in the tree and 47 more reachable
# only from git history. Nothing mechanically distinguished a production script from an abandoned
# experiment, so agents grepped, found something plausible, and chose wrong — repeatedly, at a cost
# of days. Prose cannot resolve a 74-way ambiguity. Receipts can.
#
# THE FOUR SIGNALS, AND WHY ONLY ONE COUNTS. Each of the first three was measured to be misleading:
#   in the repo          -> launch_sft_qwen36_27b_fsdp.sh was DROPPED from the tree by a clean-root
#                           transplant while still deployed and intact on every node.
#   deployed on hardware -> that same file is deployed, dated 2026-07-09, and has NEVER executed.
#   named in a document  -> train_lora_sft.py is described as production in some places and named
#                           as THE parallel-path error in consult_selflearning_loop.md:65-71.
#   EXECUTED + VERIFIED  -> cannot be faked. This is the only signal this manifest accepts.
#
# KNOWN GAP (tutor-codex, 2026-07-30, correct and not yet closed): a manifest is necessary but not
# sufficient if receipts are mutable or paths drift. The launcher MUST verify commit and content
# hashes at execution time rather than trusting this list. Until that lands, this file is an
# adjudication record, NOT yet an enforcement mechanism.

# THE ACTIVATION RULE (tutor-codex, 2026-07-30 — corrects tutor's first draft of this file):
# A file is NOT activated merely because a run wrote an artifact. Active production requires the
# capability-specific GATE to have PASSED. Rejected or partial receipts confer CANDIDATE status,
# never ACTIVE. tutor's draft marked sft_stage2_lora ADJUDICATED on the strength of r8..r14 having
# produced artifacts — but every one of those runs was REJECTED. An artifact from a rejected run
# is evidence the code executes, not evidence it qualifies.

