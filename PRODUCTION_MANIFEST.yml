# committed paths, all 27 absent; the 9B tool-SFT launcher likewise). Restored
# in a40e821.
#
# THEY ARE NOT UNDER `capabilities:` ON PURPOSE. The resolver reads only
# `capabilities` and `contested`, so nothing here can be launched by
# taey-train. That is the intent: these ran on a different hardware era against
# different base models, and marking them ADJUDICATED would make the launcher
# willing to run them today. Cataloged means findable and readable, not runnable.
historical_lines:

  qwen35_9b_dense:
    status: HISTORICAL — ran in production, superseded by the 27B line
    what_it_was: Phase-1/Phase-2 dense 9B — continued pretraining plus tool-use SFT.
    entrypoints:
      cpt: dense-9b/recipes/launch_cpt_phase2_qwen35_9b_fsdp.sh
      sft_tools: dense-9b/recipes/launch_sft_tools_qwen35_9b_fsdp.sh
    receipts:
      phase1_sft_total_steps: 4367   # readable in the launcher itself
    note: >
      The tool-SFT launcher was the file dropped by the transplant; the CPT
      launcher survived. Restored from e56fb457, the last commit holding it.

  qwen35_35b_moe:
    status: HISTORICAL — ran in production, retain-or-retire is Jesse's open decision
    what_it_was: >
      35B MoE line — expert-masked SFT and three DPO rounds, with a frozen-expert
      strategy (159 frozen experts) and keystone-layer freeze masks.
    entrypoints:
      sft: moe-35b/recipes/launch_production_sft.sh
      dpo_v1: moe-35b/recipes/launch_religion_dpo_v1.sh
      dpo_v2: moe-35b/recipes/launch_religion_dpo_v2.sh
      dpo_v3: moe-35b/recipes/launch_religion_dpo_v3.sh
    trainers:
      - moe-35b/trainers/train_fsdp_v3.py
      - moe-35b/trainers/train_dpo_v2.py
      - moe-35b/trainers/fsdp_expert_masking.py
      - moe-35b/trainers/training_data_gate_v2.py
    receipts:
      # Audit numbers below come from docs/METRICS_PROVENANCE.md, which is ALSO
      # dropped from the tree (61 lines, recoverable from history). The proof
      # directory it cites, audit_results/, is likewise absent. So these are
      # recorded as REPORTED, not re-verified — the proof files are not
      # currently openable, and that is the honest register.
      religion_dpo_v2_config_A2: "138/163 = 84.7%, +1.9pp over the SFT baseline [REPORTED]"
      religion_dpo_v1_config_A: "133/163 = 81.6%, -1.2pp — a documented regression [REPORTED]"
      phase_combined_v1_sft_baseline: "135/163 = 82.8% [REPORTED]"
      dpo_recovery_p2v3: "87/163 = 53.4% — the file's own headline says recovery did NOT recover [REPORTED]"
      frozen_experts: 159
    missing_proof:
      - docs/METRICS_PROVENANCE.md   # 61 lines, in history, not in tree
      - audit_results/               # per-checkpoint verdicts, not in tree
    note: >
      Training DATA for this line is deliberately excluded. The datasets under
      datasets/current/moe-35b/ are NOT restored and must not be: scripts and
      configurations are public, what is trained on never is.
