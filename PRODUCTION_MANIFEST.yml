root_cause_of_the_ambiguity: >
  Clean-root transplants. When the public scanner refuses a push on contaminated history, the
  remedy is a parentless commit carrying forward only the files someone remembered. Everything
  else silently leaves the tree while remaining deployed on the hardware. The next agent greps,
  finds nothing, and rebuilds it without the fixes that were paid for once. This WILL recur until
  a transplant is required to emit a manifest of what it drops.

# ============================================================================
# HISTORICAL PRODUCTION LINES — cataloged, deliberately NOT launchable
# ============================================================================
# Added 2026-07-30 answering a direct question: do we hold every production
# training line we have ever run, in one place, cataloged? We did not. The
# capabilities map above covers the 27B line only. These two lines ALSO ran in
# production and produced audited results, but their code had been dropped from
# the tree by a clean-root transplant and existed only in history (moe-35b: 27
# committed paths, all 27 absent; the 9B tool-SFT launcher likewise). Restored
# in a40e821.
#
# THEY ARE NOT UNDER `capabilities:` ON PURPOSE. The resolver reads only
# `capabilities` and `contested`, so nothing here can be launched by
# taey-train. That is the intent: these ran on a different hardware era against
# different base models, and marking them ADJUDICATED would make the launcher
# willing to run them today. Cataloged means findable and readable, not runnable.
